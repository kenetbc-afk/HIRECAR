<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIRECAR Travel Playbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&family=Cormorant+Garamond:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   TOKENS
═══════════════════════════════════════════ */
:root {
  --ink:       #111820;
  --ink-2:     #1e2530;
  --ink-3:     #2d3540;
  --slate:     #3d4a58;
  --mid:       #6b7280;
  --muted:     #9aa3ad;
  --border:    #dde1e7;
  --border-lt: #edf0f3;
  --bg:        #ffffff;
  --white:     #ffffff;
  --rule:      #111820;
  --cta:       #c9920a;
  --cta-hover: #b07d06;
  --cta-bg:    #fef3d0;
  --live:      #c0392b;
  --member:    #0f4c75;
  --member-lt: #e8f2f9;
  --teal:      #0d9488;
  --teal-bg:   #e6f7f5;
  --radius:    8px;
  --shadow:    0 2px 8px rgba(0,0,0,.08);
  --shadow-lg: 0 4px 20px rgba(0,0,0,.12);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito Sans', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  color: var(--ink);
  background: var(--bg);
  overflow-x: hidden;
}

a { text-decoration: none; color: inherit; }
img { display: block; max-width: 100%; }

.serif { font-family: 'Cormorant Garamond', Georgia, serif; }
.mono  { font-family: 'DM Mono', monospace; }
.wrap  { max-width: 1340px; margin: 0 auto; padding: 0 20px; }

/* ═══════════════════════════════════════════
   UTILITY BAR
═══════════════════════════════════════════ */
.util-bar {
  background: var(--ink);
  padding: 7px 0;
  border-bottom: 1px solid var(--ink-3);
}
.util-inner {
  max-width: 1340px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.util-back a {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .3px;
  transition: color .2s;
}
.util-back a:hover { color: var(--white); }
.util-back a + a { margin-left: 18px; }

/* ─── Ticker ─── */
.util-ticker {
  flex: 1;
  overflow: hidden;
  position: relative;
}
.ticker-track {
  display: flex;
  gap: 60px;
  white-space: nowrap;
  will-change: transform;
}
.ticker-track span {
  color: #c9d1d9;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .2px;
}
.ticker-label {
  background: var(--cta);
  color: var(--ink) !important;
  padding: 1px 7px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  margin-right: 6px;
}

/* ═══════════════════════════════════════════
   MASTHEAD
═══════════════════════════════════════════ */
.masthead {
  text-align: center;
  padding: 28px 20px 14px;
  border-bottom: 3px double var(--rule);
}
.masthead-logo {
  height: 32px;
  margin: 0 auto 6px;
  display: block;
}
.masthead-brand {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 38px;
  font-weight: 700;
  letter-spacing: -1px;
  line-height: 1.1;
}
.masthead-sub {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2.5px;
  color: var(--mid);
  margin-top: 2px;
}
.masthead-tag {
  display: inline-block;
  background: var(--cta-bg);
  color: var(--cta);
  font-size: 11px;
  font-weight: 800;
  padding: 3px 12px;
  border-radius: 3px;
  margin-top: 8px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.masthead-tagline {
  font-size: 14px;
  color: var(--mid);
  margin-top: 6px;
}

/* ═══════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════ */
.nav-bar {
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 100;
}
.nav-inner {
  max-width: 1340px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  gap: 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.nav-inner::-webkit-scrollbar { display: none; }
.nav-inner a {
  flex-shrink: 0;
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 700;
  color: var(--slate);
  border-bottom: 2px solid transparent;
  transition: all .2s;
  white-space: nowrap;
}
.nav-inner a:hover { color: var(--ink); border-bottom-color: var(--cta); }
.nav-inner a.active { color: var(--ink); border-bottom-color: var(--cta); }
.nav-inner a.nav-airport {
  background: var(--cta-bg);
  color: var(--cta-hover);
  border-radius: 4px 4px 0 0;
  font-weight: 800;
}

/* ═══════════════════════════════════════════
   SECTION HEADERS
═══════════════════════════════════════════ */
.section {
  padding: 48px 0;
  border-bottom: 1px solid var(--border-lt);
}
.section:last-child { border-bottom: none; }
.section-head {
  margin-bottom: 28px;
}
.section-head h2 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 30px;
  font-weight: 700;
  line-height: 1.2;
}
.section-head .section-icon {
  font-size: 24px;
  margin-right: 8px;
}
.section-head p {
  color: var(--mid);
  font-size: 14px;
  margin-top: 4px;
}
.section-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .8px;
  padding: 3px 10px;
  border-radius: 3px;
  margin-left: 10px;
  vertical-align: middle;
}
.badge-hot  { background: #fee2e2; color: var(--live); }
.badge-gold { background: var(--cta-bg); color: var(--cta); }
.badge-new  { background: var(--member-lt); color: var(--member); }

/* ═══════════════════════════════════════════
   AIRPORT TRANSFERS
═══════════════════════════════════════════ */
.airport-section {
  background: linear-gradient(135deg, #0f1b2d 0%, #1a2940 100%);
  color: var(--white);
  padding: 56px 0;
}
.airport-section h2 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 30px;
  font-weight: 700;
  color: var(--white);
}
.airport-section .sub { color: #9aa3ad; font-size: 14px; margin-top: 4px; }
.airport-pricing {
  display: flex;
  gap: 16px;
  margin: 24px 0;
  flex-wrap: wrap;
}
.airport-price-card {
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: var(--radius);
  padding: 16px 24px;
  text-align: center;
  min-width: 140px;
}
.airport-price-card .label {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--muted);
}
.airport-price-card .price {
  font-family: 'DM Mono', monospace;
  font-size: 28px;
  font-weight: 700;
  color: var(--cta);
  margin-top: 4px;
}
.airport-price-card .from {
  font-size: 11px;
  color: var(--muted);
}
.airport-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
  margin-top: 24px;
}
.airport-chip {
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all .2s;
}
.airport-chip:hover { background: rgba(255,255,255,.12); }
.airport-chip .code {
  font-family: 'DM Mono', monospace;
  color: var(--cta);
  font-size: 14px;
  font-weight: 700;
}
.airport-chip .city { color: #c9d1d9; font-size: 12px; }
.airport-chip .primary-tag {
  font-size: 9px;
  background: var(--cta);
  color: var(--ink);
  padding: 1px 6px;
  border-radius: 2px;
  font-weight: 800;
  text-transform: uppercase;
  margin-left: auto;
}
.btn-airport {
  display: inline-block;
  margin-top: 24px;
  padding: 14px 36px;
  background: var(--cta);
  color: var(--ink);
  font-weight: 800;
  font-size: 14px;
  border-radius: 6px;
  transition: background .2s;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.btn-airport:hover { background: var(--cta-hover); }

/* ═══════════════════════════════════════════
   FLEET SELECTOR
═══════════════════════════════════════════ */
.fleet-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}
.fleet-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: box-shadow .2s, transform .2s;
}
.fleet-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.fleet-card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}
.fleet-card-body {
  padding: 16px;
}
.fleet-card-body .type {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--cta);
}
.fleet-card-body h3 { font-size: 18px; font-weight: 700; margin-top: 2px; }
.fleet-card-body .desc { font-size: 13px; color: var(--mid); margin-top: 4px; }
.fleet-card-body .capacity {
  font-size: 12px;
  color: var(--slate);
  margin-top: 8px;
  font-weight: 600;
}
.fleet-card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  border-top: 1px solid var(--border-lt);
}
.fleet-card-footer .price {
  font-family: 'DM Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  color: var(--ink);
}
.fleet-card-footer .price-from {
  font-size: 11px;
  color: var(--mid);
  font-weight: 400;
  font-family: 'Nunito Sans', sans-serif;
}
.btn-book {
  display: inline-block;
  padding: 8px 18px;
  background: var(--cta);
  color: var(--ink);
  font-size: 12px;
  font-weight: 800;
  border-radius: 5px;
  text-transform: uppercase;
  letter-spacing: .3px;
  transition: background .2s;
}
.btn-book:hover { background: var(--cta-hover); }

/* ═══════════════════════════════════════════
   PLAYBOOK CARDS
═══════════════════════════════════════════ */
.playbook-filters {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.playbook-filters button {
  padding: 6px 16px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--bg);
  font-size: 12px;
  font-weight: 700;
  color: var(--slate);
  cursor: pointer;
  transition: all .2s;
  text-transform: uppercase;
  letter-spacing: .5px;
  font-family: 'Nunito Sans', sans-serif;
}
.playbook-filters button:hover { border-color: var(--cta); color: var(--cta); }
.playbook-filters button.active {
  background: var(--cta);
  color: var(--ink);
  border-color: var(--cta);
}
.playbook-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 24px;
}
.playbook-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: box-shadow .2s;
}
.playbook-card:hover { box-shadow: var(--shadow-lg); }
.playbook-card-img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}
.playbook-card-body { padding: 20px; }
.playbook-card-body .index-num {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--cta);
  font-weight: 700;
}
.playbook-card-body h3 {
  font-size: 20px;
  font-weight: 800;
  margin-top: 2px;
  line-height: 1.3;
}
.playbook-card-body .tag-line {
  font-size: 13px;
  color: var(--mid);
  margin-top: 2px;
}
.playbook-meta {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.playbook-meta .meta-pill {
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 3px;
  background: var(--border-lt);
  color: var(--slate);
  text-transform: uppercase;
  letter-spacing: .3px;
}
.playbook-meta .vehicle-pill {
  background: var(--cta-bg);
  color: var(--cta-hover);
}
.playbook-days {
  margin-top: 14px;
  border-top: 1px solid var(--border-lt);
  padding-top: 14px;
}
.playbook-day {
  display: flex;
  gap: 10px;
  margin-bottom: 8px;
  font-size: 13px;
}
.playbook-day .day-label {
  font-family: 'DM Mono', monospace;
  font-weight: 700;
  color: var(--cta);
  flex-shrink: 0;
  min-width: 52px;
  font-size: 12px;
}
.playbook-day .day-desc { color: var(--slate); }
.playbook-card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
  border-top: 1px solid var(--border-lt);
  background: #fafbfc;
}
.playbook-price .now {
  font-family: 'DM Mono', monospace;
  font-size: 22px;
  font-weight: 700;
}
.playbook-price .sub {
  font-size: 11px;
  color: var(--mid);
}
.playbook-price .was {
  font-size: 12px;
  color: var(--muted);
  text-decoration: line-through;
  margin-left: 8px;
}

/* ═══════════════════════════════════════════
   DEAL CAROUSEL CARDS
═══════════════════════════════════════════ */
.deal-row {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  padding-bottom: 8px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}
.deal-card {
  flex-shrink: 0;
  width: 280px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: box-shadow .2s, transform .2s;
  background: var(--bg);
  display: flex;
  flex-direction: column;
}
.deal-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.deal-card.hero-card {
  width: 380px;
}
.deal-card-img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  background: var(--border-lt);
}
.deal-card-body { padding: 14px; flex: 1; }
.deal-card-body .property {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--cta);
}
.deal-card-body h4 {
  font-size: 15px;
  font-weight: 700;
  line-height: 1.3;
  margin-top: 3px;
}
.deal-card-body .location {
  font-size: 12px;
  color: var(--mid);
  margin-top: 3px;
}
.deal-card-body .stars {
  font-size: 13px;
  color: var(--cta);
  margin-top: 6px;
}
.deal-card-body .reviews {
  font-size: 11px;
  color: var(--muted);
  margin-left: 4px;
}
.deal-tags {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.deal-tags span {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 3px;
  background: var(--border-lt);
  color: var(--slate);
}
.deal-tags .dc-tag-gold { background: var(--cta-bg); color: var(--cta-hover); }
.deal-tags .dc-tag-teal { background: var(--teal-bg); color: var(--teal); }
.deal-card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  border-top: 1px solid var(--border-lt);
}
.deal-card-footer .price-now {
  font-family: 'DM Mono', monospace;
  font-size: 20px;
  font-weight: 700;
}
.deal-card-footer .price-was {
  font-size: 12px;
  color: var(--muted);
  text-decoration: line-through;
  margin-left: 6px;
}
.deal-card-footer .price-unit {
  font-size: 11px;
  color: var(--mid);
  font-weight: 400;
}
.see-all-link {
  display: inline-block;
  margin-top: 16px;
  font-size: 13px;
  font-weight: 700;
  color: var(--cta);
  border-bottom: 1px solid var(--cta);
  transition: opacity .2s;
}
.see-all-link:hover { opacity: .7; }

/* ═══════════════════════════════════════════
   AFFILIATE STRIP
═══════════════════════════════════════════ */
.aff-strip {
  background: var(--border-lt);
  padding: 40px 0;
  text-align: center;
}
.aff-strip h2 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 26px;
  font-weight: 700;
}
.aff-strip p { color: var(--mid); font-size: 14px; margin-top: 4px; }
.aff-btns {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 20px;
  flex-wrap: wrap;
}
.aff-btns a {
  padding: 12px 28px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 800;
  transition: all .2s;
  text-transform: uppercase;
  letter-spacing: .3px;
}
.aff-btn-primary { background: var(--cta); color: var(--ink); }
.aff-btn-primary:hover { background: var(--cta-hover); }
.aff-btn-outline { background: var(--bg); color: var(--ink); border: 1px solid var(--border); }
.aff-btn-outline:hover { border-color: var(--cta); color: var(--cta); }
.aff-btn-teal { background: var(--teal); color: var(--white); }
.aff-btn-teal:hover { background: #0b7c72; }

/* ═══════════════════════════════════════════
   MEMBERSHIP CTA
═══════════════════════════════════════════ */
.member-cta {
  background: linear-gradient(135deg, #0a1628 0%, #132744 100%);
  color: var(--white);
  padding: 56px 0;
  text-align: center;
}
.member-cta h2 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 34px;
  font-weight: 700;
  color: var(--cta);
}
.member-cta p { color: #9aa3ad; font-size: 15px; margin-top: 6px; }
.member-cta .price-tag {
  font-family: 'DM Mono', monospace;
  font-size: 32px;
  font-weight: 700;
  color: var(--white);
  margin-top: 16px;
}
.member-cta .btns { margin-top: 20px; }
.member-cta .btns a {
  display: inline-block;
  margin: 0 8px;
  padding: 14px 36px;
  border-radius: 6px;
  font-weight: 800;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: .5px;
  transition: all .2s;
}
.btn-member-primary { background: var(--cta); color: var(--ink); }
.btn-member-primary:hover { background: var(--cta-hover); }
.btn-member-outline { border: 1px solid rgba(255,255,255,.25); color: var(--white); }
.btn-member-outline:hover { border-color: var(--cta); color: var(--cta); }

/* ═══════════════════════════════════════════
   FOOTER
═══════════════════════════════════════════ */
.site-footer {
  background: var(--ink);
  color: #9aa3ad;
  padding: 40px 0;
  text-align: center;
  font-size: 13px;
}
.site-footer .logo-img {
  height: 28px;
  margin: 0 auto 10px;
  filter: brightness(2);
}
.site-footer a { color: var(--cta); }
.site-footer a:hover { text-decoration: underline; }
.footer-links {
  margin-top: 12px;
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

/* ═══════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════ */
@media (max-width: 768px) {
  .masthead-brand { font-size: 26px; }
  .section-head h2 { font-size: 24px; }
  .playbook-grid { grid-template-columns: 1fr; }
  .fleet-grid { grid-template-columns: 1fr; }
  .deal-card.hero-card { width: 300px; }
  .airport-pricing { flex-direction: column; }
  .airport-grid { grid-template-columns: repeat(2, 1fr); }
  .member-cta .btns a { margin-bottom: 8px; }
}

/* ─── Ticker animation ─── */
@keyframes ticker-scroll {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* ─── Loading state ─── */
.loading {
  text-align: center;
  padding: 80px 20px;
  color: var(--mid);
  font-size: 16px;
}
.loading::after {
  content: '';
  display: block;
  width: 40px;
  height: 40px;
  border: 3px solid var(--border);

:"https://www.booking.com/?aid=YOUR_BOOKING_AID&utm_source=hirecar-travel"},{"label":"Viator Tours \u2192","class":"aff-btn-outline","url":"https://www.viator.com/?pid=YOUR_VIATOR_PID&utm_source=hirecar-travel"},{"label":"RVshare \u2192","class":"aff-btn-teal","url":"https://www.rvshare.com/?referral_code=YOUR_RVSHARE_AFF&utm_source=hirecar-travel"}]},"membership":{"headline":"HIRECAR First Class\u2122","subline":"Member-only rates. Priority dispatch. Annual access to every deal on this page.","price":"$1,380/yr","ctaUrl":"https://www.hirecar.la/first-class?utm_source=travel-playbook&utm_medium=member-cta","signinUrl":"https://www.hirecar.la/sign-in"}};</script>
<script>
(async function() {
  const app = document.getElementById('app');

  let D;
  try {
    const res = await fetch('./hirecar-travel-playbook-data.json');
    D = await res.json();
  } catch(e) {
    // Fallback: try inline data
    if (typeof window.__PLAYBOOK_DATA !== 'undefined') {
      D = window.__PLAYBOOK_DATA;
    } else {
      app.innerHTML = '<p style="text-align:center;padding:60px;color:#c0392b;">Failed to load playbook data.</p>';
      return;
    }
  }

  document.title = D.site.title;

  /* ── Helpers ── */
  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  /* ── Build ticker ── */
  function buildTicker() {
    const items = D.ticker.items.map(t =>
      '<span>' + esc(t.emoji) + ' <span class="ticker-label">' + esc(t.label) + '</span> ' + esc(t.text) + '</span>'
    ).join('');
    const doubled = items + items;
    return '<div class="util-bar">' +
      '<div class="util-inner">' +
        '<div class="util-back" id="util-back"></div>' +
        '<div class="util-ticker">' +
          '<div class="ticker-track" style="animation: ticker-scroll ' + esc(D.ticker.speed) + ' linear infinite;">' + doubled + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  /* ── Build masthead ── */
  function buildMasthead() {
    var b = D.site.brand;
    return '<div class="masthead">' +
      '<img class="masthead-logo" src="' + esc(b.logoUrl) + '" alt="' + esc(b.name) + '">' +
      '<div class="masthead-brand serif">' + esc(b.name) + '</div>' +
      '<div class="masthead-sub">' + esc(b.subBrandSub) + '</div>' +
      '<div class="masthead-tag">' + esc(b.sectionTag) + '</div>' +
      '<div class="masthead-tagline">' + esc(b.tagline) + '</div>' +
    '</div>';
  }

  /* ── Build nav ── */
  function buildNav() {
    var links = D.nav.links.map(function(l) {
      var cls = [];
      if (l.active) cls.push('active');
      if (l.class) cls.push(l.class);
      var clsAttr = cls.length ? ' class="' + cls.join(' ') + '"' : '';
      return '<a href="' + esc(l.href) + '"' + clsAttr + '>' + esc(l.label) + '</a>';
    }).join('');
    return '<nav class="nav-bar"><div class="nav-inner">' + links + '</div></nav>';
  }

  /* ── Build airport section ── */
  function buildAirports() {
    var a = D.airports;
    var pricingCards = Object.values(a.pricing).map(function(p) {
      return '<div class="airport-price-card">' +
        '<div class="label">' + esc(p.label) + '</div>' +
        '<div class="price">' + esc(p.from) + '</div>' +
        '<div class="from">from</div>' +
      '</div>';
    }).join('');

    var chips = a.locations.map(function(loc) {
      return '<div class="airport-chip">' +
        '<span class="code">' + esc(loc.code) + '</span>' +
        '<span class="city">' + esc(loc.city) + '</span>' +
        (loc.tag ? '<span class="primary-tag">' + esc(loc.tag) + '</span>' : '') +
      '</div>';
    }).join('');

    return '<section class="airport-section" id="airport-transfers"><div class="wrap">' +
      '<h2 class="serif">' + esc(a.headline) + '</h2>' +
      '<p class="sub">' + esc(a.subline) + '</p>' +
      '<div class="airport-pricing">' + pricingCards + '</div>' +
      '<div class="airport-grid">' + chips + '</div>' +
      '<a class="btn-airport" href="' + esc(a.bookUrl) + '" target="_blank" rel="noopener">Book Airport Transfer</a>' +
    '</div></section>';
  }

  /* ── Build fleet section ── */
  function buildFleet() {
    var f = D.fleet;
    var cards = f.vehicles.map(function(v) {
      return '<div class="fleet-card">' +
        '<img src="' + esc(v.image) + '" alt="' + esc(v.name) + '" loading="lazy">' +
        '<div class="fleet-card-body">' +
          '<div class="type">' + esc(v.type) + '</div>' +
          '<h3>' + esc(v.name) + '</h3>' +
          '<p class="desc">' + esc(v.description) + '</p>' +
          '<p class="capacity">' + esc(v.capacity) + '</p>' +
        '</div>' +
        '<div class="fleet-card-footer">' +
          '<div class="price"><span class="price-from">from </span>' + esc(v.priceFrom) + '</div>' +
          '<a class="btn-book" href="' + esc(v.bookUrl) + '" target="_blank" rel="noopener">Book</a>' +
        '</div>' +
      '</div>';
    }).join('');

    return '<section class="section" id="fleet"><div class="wrap">' +
      '<div class="section-head">' +
        '<h2 class="serif">' + esc(f.headline) + '</h2>' +
        '<p>' + esc(f.subline) + '</p>' +
      '</div>' +
      '<div class="fleet-grid">' + cards + '</div>' +
    '</div></section>';
  }

  /* ── Build playbooks section ── */
  function buildPlaybooks() {
    var pb = D.playbooks;

    var filterBtns = pb.vehicleFilters.map(function(f, i) {
      return '<button data-filter="' + esc(f) + '"' + (i === 0 ? ' class="active"' : '') + '>' +
        (f === 'all' ? 'All Trips' : esc(f.toUpperCase())) + '</button>';
    }).join('');

    var cards = pb.trips.map(function(t) {
      var vehiclePills = t.vehicles.map(function(v) {
        return '<span class="meta-pill vehicle-pill">' + esc(v.toUpperCase()) + '</span>';
      }).join('');

      var days = t.days.map(function(d) {
        return '<div class="playbook-day">' +
          '<span class="day-label">' + esc(d.label) + '</span>' +
          '<span class="day-desc">' + esc(d.desc) + '</span>' +
        '</div>';
      }).join('');

      return '<div class="playbook-card" data-vehicles="' + esc(t.vehicles.join(',')) + '">' +
        '<img class="playbook-card-img" src="' + esc(t.image) + '" alt="' + esc(t.name) + '" loading="lazy">' +
        '<div class="playbook-card-body">' +
          '<span class="index-num mono">Playbook ' + esc(t.index) + '</span>' +
          '<h3>' + esc(t.name) + '</h3>' +
          '<p class="tag-line">' + esc(t.tagLine) + '</p>' +
          '<div class="playbook-meta">' +
            '<span class="meta-pill">' + esc(t.meta) + '</span>' +
            vehiclePills +
          '</div>' +
          '<div class="playbook-days">' + days + '</div>' +
        '</div>' +
        '<div class="playbook-card-footer">' +
          '<div class="playbook-price">' +
            '<span class="now">' + esc(t.priceDisplay) + '</span>' +
            '<span class="sub">' + esc(t.priceSub) + '</span>' +
            (t.priceWas ? '<span class="was">' + esc(t.priceWas) + '</span>' : '') +
          '</div>' +
          '<a class="btn-book" href="' + esc(t.bookBtn.url) + '" target="_blank" rel="noopener">' + esc(t.bookBtn.label) + '</a>' +
        '</div>' +
      '</div>';
    }).join('');

    return '<section class="section" id="' + esc(pb.sectionId) + '"><div class="wrap">' +
      '<div class="section-head"><h2 class="serif">' + esc(pb.headline) + '</h2></div>' +
      '<div class="playbook-filters" id="playbook-filters">' + filterBtns + '</div>' +
      '<div class="playbook-grid" id="playbook-grid">' + cards + '</div>' +
    '</div></section>';
  }

  /* ── Build deal carousel section ── */
  function buildDealCarousel(carousel) {
    var badgeHTML = carousel.badge
      ? '<span class="section-badge ' + esc(carousel.badge.class) + '">' + esc(carousel.badge.label) + '</span>'
      : '';

    var cards = carousel.cards.map(function(c) {
      var imgHTML = c.image
        ? '<img class="deal-card-img" src="' + esc(c.image) + '" alt="' + esc(c.property) + '" loading="lazy">'
        : '';

      var tags = (c.tags || []).map(function(t) {
        return '<span' + (t.class ? ' class="' + esc(t.class) + '"' : '') + '>' + esc(t.label) + '</span>';
      }).join('');

      return '<a class="deal-card' + (c.type === 'hero' ? ' hero-card' : '') + '" href="' + esc(c.url) + '" target="_blank" rel="noopener">' +
        imgHTML +
        '<div class="deal-card-body">' +
          '<div class="property">' + esc(c.property) + '</div>' +
          '<h4>' + esc(c.title) + '</h4>' +
          '<div class="location">' + esc(c.location) + '</div>' +
          '<div>' +
            '<span class="stars">' + esc(c.stars) + '</span>' +
            '<span class="reviews">(' + esc(c.reviewCount) + ')</span>' +
          '</div>' +
          (tags ? '<div class="deal-tags">' + tags + '</div>' : '') +
        '</div>' +
        '<div class="deal-card-footer">' +
          '<div>' +
            '<span class="price-now">' + esc(c.priceNow) + '</span>' +
            (c.priceWas ? '<span class="price-was">' + esc(c.priceWas) + '</span>' : '') +
            '<span class="price-unit">' + esc(c.priceUnit) + '</span>' +
          '</div>' +
        '</div>' +
      '</a>';
    }).join('');

    return '<section class="section" id="' + esc(carousel.id) + '"><div class="wrap">' +
      '<div class="section-head">' +
        '<h2 class="serif"><span class="section-icon">' + esc(carousel.icon) + '</span>' + esc(carousel.title) + badgeHTML + '</h2>' +
      '</div>' +
      '<div class="deal-row">' + cards + '</div>' +
      '<a class="see-all-link" href="' + esc(carousel.seeAllUrl) + '" target="_blank" rel="noopener">See All ' + esc(carousel.title) + ' &rarr;</a>' +
    '</div></section>';
  }

  /* ── Build affiliate strip ── */
  function buildAffStrip() {
    var a = D.affiliateStrip;
    var btns = a.buttons.map(function(b) {
      return '<a class="' + esc(b.class) + '" href="' + esc(b.url) + '" target="_blank" rel="noopener">' + esc(b.label) + '</a>';
    }).join('');
    return '<div class="aff-strip"><div class="wrap">' +
      '<h2 class="serif">' + esc(a.headline) + '</h2>' +
      '<p>' + esc(a.subline) + '</p>' +
      '<div class="aff-btns">' + btns + '</div>' +
    '</div></div>';
  }

  /* ── Build membership CTA ── */
  function buildMembership() {
    var m = D.membership;
    return '<section class="member-cta"><div class="wrap">' +
      '<h2 class="serif">' + esc(m.headline) + '</h2>' +
      '<p>' + esc(m.subline) + '</p>' +
      '<div class="price-tag mono">' + esc(m.price) + '</div>' +
      '<div class="btns">' +
        '<a class="btn-member-primary" href="' + esc(m.ctaUrl) + '" target="_blank" rel="noopener">Join First Class</a>' +
        '<a class="btn-member-outline" href="' + esc(m.signinUrl) + '" target="_blank" rel="noopener">Sign In</a>' +
      '</div>' +
    '</div></section>';
  }

  /* ── Build footer ── */
  function buildFooter() {
    var c = D.site.company;
    var b = D.site.brand;
    return '<footer class="site-footer"><div class="wrap">' +
      '<img class="logo-img" src="' + esc(b.logoUrl) + '" alt="' + esc(b.name) + '">' +
      '<p>' + esc(c.address) + '</p>' +
      '<p><a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a> &middot; <a href="tel:' + esc(c.phone) + '">' + esc(c.phone) + '</a></p>' +
      '<div class="footer-links">' +
        '<a href="' + esc(c.website) + '" target="_blank" rel="noopener">' + esc(c.website) + '</a>' +
        '<a href="' + esc(c.marketwatch) + '" target="_blank" rel="noopener">MarketWatch!</a>' +
      '</div>' +
      '<p style="margin-top:16px;font-size:11px;color:#555;">&copy; ' + new Date().getFullYear() + ' ' + esc(b.name) + '. All rights reserved. ' + esc(b.subBrandSub) + '</p>' +
    '</div></footer>';
  }

  /* ═══════════════════════════════════════════
     RENDER
  ═══════════════════════════════════════════ */
  var html = '';
  html += buildTicker();
  html += buildMasthead();
  html += buildNav();
  html += buildAirports();
  html += buildFleet();
  html += buildPlaybooks();

  D.dealCarousels.forEach(function(c) { html += buildDealCarousel(c); });

  html += buildAffStrip();
  html += buildMembership();
  html += buildFooter();

  app.className = '';
  app.innerHTML = html;

  /* ── Populate back-links ── */
  var utilBack = document.getElementById('util-back');
  if (utilBack && D.nav.backLinks) {
    utilBack.innerHTML = D.nav.backLinks.map(function(l) {
      return '<a href="' + esc(l.href) + '" target="_blank" rel="noopener">' + esc(l.label) + '</a>';
    }).join('');
  }

  /* ── Playbook filter logic ── */
  var filterContainer = document.getElementById('playbook-filters');
  var grid = document.getElementById('playbook-grid');
  if (filterContainer && grid) {
    filterContainer.addEventListener('click', function(e) {
      if (e.target.tagName !== 'BUTTON') return;
      filterContainer.querySelectorAll('button').forEach(function(b) { b.classList.remove('active'); });
      e.target.classList.add('active');
      var f = e.target.dataset.filter;
      grid.querySelectorAll('.playbook-card').forEach(function(card) {
        if (f === 'all') { card.style.display = ''; return; }
        var vehicles = card.dataset.vehicles.split(',');
        card.style.display = vehicles.indexOf(f) !== -1 ? '' : 'none';
      });
    });
  }

  /* ── Smooth scroll for nav links ── */
  document.querySelectorAll('.nav-inner a[href^="#"]').forEach(function(a) {
    a.addEventListener('click', function(e) {
      var target = document.querySelector(this.getAttribute('href'));
      if (target) {
        e.preventDefault();
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  });

})();
</script>
</body>
</html>
